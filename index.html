<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <title>ArcPredict Pro</title>
</head>
<body class="bg-[#050505] text-white font-sans">
    <nav class="border-b border-white/10 p-5 flex justify-between items-center bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold italic shadow-lg shadow-blue-500/20">A</div>
            <span class="text-xl font-black tracking-tighter uppercase">Arc Predict</span>
        </div>
        <button id="connectBtn" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-full font-bold transition-all text-sm">Connect Wallet</button>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12 pb-32">
        <div class="mb-12">
            <h1 class="text-5xl font-black mb-4">Trade the <span class="text-blue-500">Truth.</span></h1>
            <p class="text-gray-400">Polymarket-style liquidity on Arc Testnet.</p>
        </div>

        <div id="markets" class="grid gap-6">
            <div class="bg-[#0f0f0f] border border-white/5 rounded-3xl p-8 hover:border-blue-500/40 transition-all">
                <h3 class="text-2xl font-bold mb-6">Will Arc hit Mainnet in 2026?</h3>
                <div class="flex gap-4">
                    <button class="flex-1 bg-green-500/10 border border-green-500/20 text-green-500 py-4 rounded-2xl font-black hover:bg-green-500 hover:text-black transition-all">BUY YES</button>
                    <button class="flex-1 bg-red-500/10 border border-red-500/20 text-red-500 py-4 rounded-2xl font-black hover:bg-red-500 hover:text-black transition-all">BUY NO</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 w-full p-6 bg-gradient-to-t from-black to-transparent flex justify-center z-50">
        <a href="https://x.com/big_4_l" target="_blank" class="flex items-center gap-2 bg-white/5 backdrop-blur-xl border border-white/10 px-6 py-3 rounded-full hover:scale-105 transition-all group">
            <span class="text-gray-500 text-sm">Built by</span>
            <span class="font-bold text-white group-hover:text-blue-400">@big_4_l</span>
        </a>
    </footer>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        connectBtn.onclick = async () => {
            if (window.ethereum) {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                connectBtn.innerText = accounts[0].slice(0,6) + "...";
            } else {
                alert("Please install MetaMask!");
            }
        };
    </script>
</body>
</html>
